<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Management RQ Kamila V3</title>
    
    <meta name="theme-color" content="#2b394a" />
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- SheetJS (Untuk Import/Export Excel Dapodik) -->
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    
    <!-- CSS Modular -->
    <link rel="stylesheet" href="css/style.css">

    <!-- ==========================================
         CSS KHUSUS SPLASH SCREEN (PINTU GERBANG)
         ========================================== -->
    <style>
        /* Overlay layar penuh untuk menutupi dashboard sebelum loading selesai */
        #splashScreenOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #2b394a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999999; /* Pastikan selalu paling atas */
            color: white;
            font-family: 'Poppins', sans-serif;
            transition: opacity 0.8s ease-out;
        }

        .splash-wrapper {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 90%; max-width: 400px; text-align: center; padding: 20px; box-sizing: border-box;
        }
        
        .splash-logo { 
            width: 28vw; max-width: 120px; min-width: 90px; height: auto; object-fit: contain; 
            background: white; border-radius: 50%; padding: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.25); 
            animation: pulse 2s infinite ease-in-out, fadeIn 0.8s forwards; 
        }
        
        .splash-title { 
            margin-top: 25px; font-size: 1.8rem; font-weight: 700; letter-spacing: 1.5px; 
            opacity: 0; animation: fadeUp 0.8s ease-out forwards 0.2s;
        }
        
        .splash-subtitle { 
            font-size: 0.95rem; color: #88dec3; font-weight: 400; margin-top: -2px; 
            opacity: 0; animation: fadeUp 0.8s ease-out forwards 0.4s;
        }
        
        .splash-quote {
            margin-top: 35px; font-size: 0.9rem; font-weight: 300; font-style: italic;
            color: #d1d8e0; line-height: 1.6; opacity: 0; animation: fadeIn 1.2s ease-out forwards 0.6s; 
        }
        
        .splash-quote-author { display: block; margin-top: 6px; font-size: 0.8rem; font-weight: 600; color: #88dec3; font-style: normal; }

        .loader { margin-top: 35px; display: flex; gap: 8px; opacity: 0; animation: fadeIn 0.5s ease-out forwards 0.8s; }
        .dot { width: 10px; height: 10px; background-color: #88dec3; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes pulse { 
            0% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(136, 222, 195, 0.4); } 
            70% { transform: scale(1.04); box-shadow: 0 0 0 15px rgba(136, 222, 195, 0); } 
            100% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(136, 222, 195, 0); } 
        }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-height: 568px) {
            .splash-title { font-size: 1.5rem; margin-top: 15px; }
            .splash-quote { margin-top: 20px; font-size: 0.85rem; }
            .loader { margin-top: 20px; }
        }
    </style>
</head>
<body>

    <!-- ==========================================
         LAYER 1: SPLASH SCREEN & LOGIKA ROUTER
         ========================================== -->
    <div id="splashScreenOverlay">
        <div class="splash-wrapper">
            <img src="logokamilamodern.png" alt="Logo RQ Kamila" class="splash-logo" onerror="this.src='https://ui-avatars.com/api/?name=RQ&background=ffffff&color=2b394a'">
            
            <div class="splash-title">RQ Kamila</div>
            <div class="splash-subtitle">Manajemen Santri Terpadu</div>
            
            <div class="splash-quote">
                "Sebaik-baik kalian adalah orang yang belajar Al-Qur'an dan mengajarkannya."
                <span class="splash-quote-author">(HR. Bukhari)</span>
            </div>
            
            <div class="loader">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Berikan waktu 3 detik untuk animasi splash screen
            setTimeout(() => {
                // Cek apakah Ustadz/Admin sudah punya tiket masuk
                if (localStorage.getItem('guru_id')) {
                    // Jika SUDAH LOGIN: Pudarkan layar splash dan biarkan masuk ke Dashboard
                    const splash = document.getElementById('splashScreenOverlay');
                    splash.style.opacity = '0';
                    setTimeout(() => splash.remove(), 800); // Hapus elemen dari HTML setelah memudar
                } else {
                    // Jika BELUM LOGIN: Tendang ke halaman login
                    window.location.href = 'login.html';
                }
            }, 3000); 
        });
    </script>


    <!-- ==========================================
         LAYER 2: KONTEN DASHBOARD UTAMA
         ========================================== -->
    <div class="holy-grail-layout">
        
        <!-- SIDEBAR KIRI -->
        <aside class="region region--aside-left" id="sidebar">
            <div class="brand-logo-area">
                <img src="logokamilamodern.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=RQ&background=F0DCD7&color=4F567D'">
                <h1 style="font-size: 1.2rem; font-weight: 700; margin: 0;">RQ Kamila</h1>
            </div>
            <nav style="flex: 1;" id="main-nav">
                <a href="#dashboard" class="nav-link active"><i class="fas fa-border-all w-[20px]"></i> Dashboard</a>
                <a href="#santri" class="nav-link"><i class="fas fa-user-graduate w-[20px]"></i> Data Santri</a>
                <a href="#harian" class="nav-link"><i class="fas fa-clipboard-list w-[20px]"></i> Input Harian</a>
                <a href="#laporan" class="nav-link"><i class="fas fa-chart-pie w-[20px]"></i> Laporan</a>
                <a href="#raport" class="nav-link"><i class="fas fa-award w-[20px]"></i> Cetak Raport</a>
                <a href="#setting" class="nav-link"><i class="fas fa-cog w-[20px]"></i> Pengaturan</a>
            </nav>
            <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; margin-top: auto;">
                <a href="#logout" class="nav-link" style="color: var(--clr-koral);"><i class="fas fa-sign-out-alt"></i> Keluar</a>
            </div>
        </aside>

        <!-- HEADER -->
        <header class="region region--header">
            <div class="header-left">
                <button class="mobile-toggle" id="btnToggleSidebar"><i class="fas fa-bars"></i></button>
                <h2 id="page-title">Dashboard</h2>
            </div>
            <div class="header-actions">
                <button class="theme-btn" id="btnThemeToggle"><i class="fas fa-moon" id="themeIcon"></i></button>
                <button class="theme-btn notif-btn">
                    <i class="fas fa-bell" id="bellNotif"></i><span class="notif-badge"></span>
                </button>
                <div class="user-profile-box">
                    <span class="user-name-text" id="headerUserName">Halo, User</span>
                    <div class="avatar-box" id="avatarHeader">U</div>
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="region region--main" id="main-content">
            <!-- Akan diisi otomatis oleh JS Router -->
        </main>

        <!-- FOOTER -->
        <footer class="region region--footer">
            <div><i class="fas fa-shield-alt" style="color: var(--primary);"></i> Enkripsi Aktif</div>
            <div>RQ Kamila &copy; 2026</div>
        </footer>
    </div>

    <!-- OVERLAY SIDEBAR MOBILE -->
    <div id="sidebarOverlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99;"></div>
    
    <!-- SCRIPT PENYESUAI TAMPILAN PROFIL HEADER -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userName = localStorage.getItem('user_name') || 'Pengguna';
            const userRole = localStorage.getItem('user_role') || 'Guru';
            
            const elName = document.getElementById('headerUserName');
            const elAvatar = document.getElementById('avatarHeader');
            
            if (elName) {
                elName.textContent = userRole === 'Admin' ? `Halo, Admin` : `Ust. ${userName}`;
            }
            if (elAvatar) {
                elAvatar.textContent = userName.charAt(0).toUpperCase();
            }
        });
    </script>

    <!-- SCRIPT UTAMA -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
