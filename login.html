<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masuk - SIAKAD RQ Kamila</title>
    <!-- Menyesuaikan Theme Color dengan warna Navy Palet -->
    <meta name="theme-color" content="#4F567D" />
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            margin: 0; 
            font-family: 'Poppins', sans-serif; 
            /* Background menggunakan gradasi warna Navy dan Biru Keabuan dari palet */
            background: linear-gradient(135deg, #4F567D 0%, #313651 100%);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            color: #333; 
        }
        
        .login-wrapper {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .login-card { 
            background: rgba(255, 255, 255, 0.98); 
            padding: 40px 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
            width: 100%; 
            max-width: 380px; 
            text-align: center; 
            animation: slideUp 0.5s ease-out;
            position: relative;
            overflow: hidden;
        }
        
        /* Aksen garis tipis di atas kartu menggunakan warna koral/orange dari palet */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: #F39B96;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            margin-bottom: 20px;
        }

        .logo-area img { 
            width: 90px; 
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            /* Border warna krem dari palet */
            border: 4px solid #F0DCD7; 
            padding: 2px;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .login-title { 
            color: #4F567D; /* Warna Navy Palet */
            margin: 0 0 5px; 
            font-size: 1.4rem;
            font-weight: 700;
        }

        .login-subtitle { 
            color: #666; 
            font-size: 0.85rem; 
            margin-bottom: 30px; 
        }

        .input-group { 
            text-align: left; 
            margin-bottom: 20px; 
            position: relative; 
        }

        .input-group label { 
            display: block; 
            font-size: 0.85rem; 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: #434750; 
        }

        .input-group input { 
            width: 100%; 
            padding: 12px 15px 12px 42px; 
            border: 1px solid #c4c6d1; 
            border-radius: 10px; 
            font-size: 0.95rem; 
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box; 
            outline: none; 
            transition: all 0.3s ease; 
            background: #f8f9fb;
        }

        .input-group input:focus { 
            border-color: #4F567D; /* Navy Palet */
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 86, 125, 0.15);
        }

        .input-group i { 
            position: absolute; 
            left: 15px; 
            top: 39px; 
            color: #8999B8; /* Biru Keabuan Muda Palet */
            font-size: 1.1rem;
        }

        .btn-login { 
            background: #4F567D; /* Navy Palet */
            color: #fff; 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            font-size: 1rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s ease; 
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-login:hover { 
            background: #3a3f5c; 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 86, 125, 0.3);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-area">
                <!-- Memanggil logo modern Ustadz, dengan fallback inisial RQ jika file belum diload -->
                <img src="images/logokamilamodern.png" alt="Logo RQ Kamila" onerror="this.src='https://ui-avatars.com/api/?name=RQ&background=F0DCD7&color=4F567D&bold=true'">
            </div>
            <h2 class="login-title">RQ Kamila</h2>
            <p class="login-subtitle">Silakan masuk menggunakan akun Anda</p>
            
            <form id="formLogin">
                <div class="input-group">
                    <label>No. WhatsApp / Username</label>
                    <i class="fas fa-user"></i>
                    <input type="text" id="inputUsername" placeholder="Contoh: 08123456789" required autocomplete="off">
                </div>
                
                <div class="input-group">
                    <label>Kata Sandi</label>
                    <i class="fas fa-lock"></i>
                    <input type="password" id="inputPassword" placeholder="Masukkan kata sandi" required>
                </div>
                
                <button type="submit" class="btn-login" id="btnLogin">
                    Masuk ke Sistem <i class="fas fa-arrow-right"></i>
                </button>
            </form>
            
            <div class="footer-text">
                &copy; 2026 Rumah Qur'an Kamila. All rights reserved.
            </div>
        </div>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnLogin');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Memeriksa Akses...';
            btn.style.opacity = '0.8';
            btn.disabled = true;
            
            setTimeout(() => {
                localStorage.setItem('status_login', 'aktif'); 
                window.location.href = 'index.html'; 
            }, 1200);
        });
    </script>
</body>
</html>
