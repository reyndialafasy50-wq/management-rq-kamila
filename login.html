<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masuk - SIAKAD RQ Kamila</title>
    <meta name="theme-color" content="#4F567D" />
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            margin: 0; 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #4F567D 0%, #313651 100%);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            color: #333; 
        }
        
        .login-wrapper {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .login-card { 
            background: rgba(255, 255, 255, 0.98); 
            padding: 40px 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
            width: 100%; 
            max-width: 380px; 
            text-align: center; 
            animation: slideUp 0.5s ease-out;
            position: relative;
            overflow: hidden;
        }
        
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: #F39B96;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            margin-bottom: 20px;
        }

        .logo-area img { 
            width: 90px; 
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #F0DCD7; 
            padding: 2px;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .login-title { 
            color: #4F567D; 
            margin: 0 0 5px; 
            font-size: 1.4rem;
            font-weight: 700;
        }

        .login-subtitle { 
            color: #666; 
            font-size: 0.85rem; 
            margin-bottom: 30px; 
        }

        .input-group { 
            text-align: left; 
            margin-bottom: 20px; 
            position: relative; 
        }

        .input-group label { 
            display: block; 
            font-size: 0.85rem; 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: #434750; 
        }

        .input-group input { 
            width: 100%; 
            padding: 12px 15px 12px 42px; 
            border: 1px solid #c4c6d1; 
            border-radius: 10px; 
            font-size: 0.95rem; 
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box; 
            outline: none; 
            transition: all 0.3s ease; 
            background: #f8f9fb;
        }

        .input-group input:focus { 
            border-color: #4F567D; 
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 86, 125, 0.15);
        }

        .input-group i { 
            position: absolute; 
            left: 15px; 
            top: 39px; 
            color: #8999B8; 
            font-size: 1.1rem;
        }
        
        #errorMsg {
            display: none;
            background: #fee2e2;
            color: #dc2626;
            font-size: 0.85rem;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: left;
            border-left: 4px solid #dc2626;
        }

        .btn-login { 
            background: #4F567D; 
            color: #fff; 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            font-size: 1rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s ease; 
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-login:hover { 
            background: #3a3f5c; 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 86, 125, 0.3);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-area">
                <img src="logokamilamodern.png" alt="Logo RQ Kamila" onerror="this.src='https://ui-avatars.com/api/?name=RQ&background=F0DCD7&color=4F567D&bold=true'">
            </div>
            <h2 class="login-title">RQ Kamila</h2>
            <p class="login-subtitle">Silakan masuk menggunakan akun Anda</p>
            
            <form id="formLogin">
                <div id="errorMsg"><i class="fas fa-exclamation-circle"></i> Username atau sandi salah!</div>
                
                <div class="input-group">
                    <label>Username</label>
                    <i class="fas fa-user"></i>
                    <input type="text" id="inputUsername" placeholder="Contoh: dani" required autocomplete="off">
                </div>
                
                <div class="input-group">
                    <label>Kata Sandi</label>
                    <i class="fas fa-lock"></i>
                    <input type="password" id="inputPassword" placeholder="Masukkan kata sandi" required>
                </div>
                
                <button type="submit" class="btn-login" id="btnLogin">
                    Masuk ke Sistem <i class="fas fa-arrow-right"></i>
                </button>
            </form>
            
            <div class="footer-text">
                &copy; 2026 Rumah Qur'an Kamila. All rights reserved.
            </div>
        </div>
    </div>

    <!-- Menghubungkan langsung dengan API Supabase kita -->
    <script type="module">
        import { api } from './js/api.js';

        const formLogin = document.getElementById('formLogin');
        const btnLogin = document.getElementById('btnLogin');
        const inputUsername = document.getElementById('inputUsername');
        const inputPassword = document.getElementById('inputPassword');
        const errorMsg = document.getElementById('errorMsg');

        formLogin.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const originalText = btnLogin.innerHTML;
            btnLogin.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Memeriksa Akses...';
            btnLogin.style.opacity = '0.8';
            btnLogin.disabled = true;
            errorMsg.style.display = 'none';
            
            const username = inputUsername.value.trim();
            const password = inputPassword.value.trim();

            try {
                // Mengecek kecocokan data ke tabel 'guru' di Supabase
                const result = await api.get('guru', `select=*&username=eq.${username}&password=eq.${password}`);
                
                if (result && result.length > 0) {
                    // JIKA COCOK (BERHASIL LOGIN)
                    const user = result[0];
                    
                    // Simpan identitas penting ke memori lokal HP/Laptop (MURNI TANPA KELAS_PEGANGAN)
                    localStorage.setItem('status_login', 'aktif');
                    localStorage.setItem('guru_id', user.id);
                    localStorage.setItem('user_name', user.nama);
                    localStorage.setItem('user_role', user.role); // 'Admin' atau 'Wali Kelas'
                    
                    // Buka pintu ke aplikasi utama
                    window.location.href = 'index.html';
                } else {
                    // JIKA SALAH
                    errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Username atau sandi salah!';
                    errorMsg.style.display = 'block';
                    
                    btnLogin.innerHTML = originalText;
                    btnLogin.style.opacity = '1';
                    btnLogin.disabled = false;
                }
            } catch (err) {
                console.error("Gagal terhubung ke database:", err);
                errorMsg.innerHTML = '<i class="fas fa-wifi"></i> Gagal koneksi ke server database.';
                errorMsg.style.display = 'block';
                
                btnLogin.innerHTML = originalText;
                btnLogin.style.opacity = '1';
                btnLogin.disabled = false;
            }
        });
    </script>
</body>
</html>
